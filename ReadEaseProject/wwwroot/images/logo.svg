<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" fill="none">
  <!-- Book icon -->
  <rect x="2" y="5" width="28" height="34" rx="5" fill="#FF6122"/>
  <!-- Spine shadow -->
  <rect x="11" y="5" width="3" height="34" fill="rgba(0,0,0,0.20)"/>
  <!-- Page lines -->
  <rect x="16" y="13" width="10" height="2.2" rx="1.1" fill="white" opacity="0.95"/>
  <rect x="16" y="19" width="10" height="2.2" rx="1.1" fill="white" opacity="0.95"/>
  <rect x="16" y="25" width="7"  height="2.2" rx="1.1" fill="white" opacity="0.70"/>
  <!-- Cover gloss -->
  <rect x="3" y="6" width="5" height="32" rx="2.5" fill="rgba(255,255,255,0.18)"/>
  <!-- Wordmark: Read (dark) -->
  <text x="38" y="31"
        font-family="'Nunito','Segoe UI',sans-serif"
        font-size="23" font-weight="900" letter-spacing="-0.6"
        fill="#FFFFFF">Read</text>
  <!-- Wordmark: Ease (orange) -->
  <text x="96" y="31"
        font-family="'Nunito','Segoe UI',sans-serif"
        font-size="23" font-weight="900" letter-spacing="-0.6"
        fill="#FF6122">Ease</text>
</svg>
